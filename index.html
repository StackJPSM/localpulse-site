<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EVOORA Shopify Test</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#050816;
  color:white;
  padding:40px;
}

h1{
  color:#63f5d2;
  margin-bottom:30px;
}

.product-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(300px,1fr));

  gap:25px;
}

.product-card{
  background:#0d1324;
  border:1px solid rgba(99,245,210,0.15);
  border-radius:20px;
  overflow:hidden;
}

.product-card img{
  width:100%;
  height:320px;
  object-fit:cover;
}

.product-info{
  padding:20px;
}

.price{
  color:#63f5d2;
  font-size:1.4rem;
  font-weight:bold;
  margin:15px 0;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#63f5d2;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

pre{
  background:#111827;
  padding:20px;
  border-radius:15px;
  overflow:auto;
  margin-top:40px;
  color:#9ca3af;
}

</style>
</head>

<body>

<h1>EVOORA Shopify Product Test</h1>

<div class="product-grid" id="productGrid"></div>

<pre id="debug">
Loading Shopify response...
</pre>

<script>

/* =========================================
SHOPIFY SETTINGS
========================================= */

const domain = 'k3xcdb-cx.myshopify.com';

const storefrontAccessToken =
'atkn_35faec7a6eeda70d89a377eb319aeed7405653f8c64b89fdf07920d2fa54d3b1';

/* =========================================
FETCH PRODUCTS
========================================= */

fetch(`https://${domain}/api/2024-01/graphql.json`, {

  method:'POST',

  headers:{
    'Content-Type':'application/json',
    'X-Shopify-Storefront-Access-Token':
    storefrontAccessToken
  },

  body:JSON.stringify({

    query: `
    {
      products(first: 10) {

        edges {

          node {

            id

            title

            description

            images(first:1){
              edges{
                node{
                  url
                }
              }
            }

            variants(first:1){
              edges{
                node{
                  id

                  price{
                    amount
                  }
                }
              }
            }

          }

        }

      }
    }
    `
  })

})

.then(res => res.json())

.then(data => {

  console.log(data);

  document.getElementById('debug')
  .textContent =
  JSON.stringify(data,null,2);

  const products =
  data?.data?.products?.edges || [];

  const grid =
  document.getElementById('productGrid');

  if(products.length === 0){

    grid.innerHTML = `
      <h2>
        No products found.
      </h2>
    `;

    return;
  }

  products.forEach(({node}) => {

    const image =
    node.images.edges[0]?.node.url ||
    'https://via.placeholder.com/500x500';

    const variant =
    node.variants.edges[0]?.node;

    const price =
    variant?.price?.amount || '0.00';

    const variantId =
    variant?.id;

    const card =
    document.createElement('div');

    card.className =
    'product-card';

    card.innerHTML = `

      <img src="${image}">

      <div class="product-info">

        <h2>${node.title}</h2>

        <p>
          ${node.description || 'No description'}
        </p>

        <div class="price">
          $${price}
        </div>

        <button onclick="buyNow('${variantId}')">
          BUY NOW
        </button>

      </div>
    `;

    grid.appendChild(card);

  });

})

.catch(error => {

  console.error(error);

  document.getElementById('debug')
  .textContent =
  error.toString();

});

/* =========================================
CHECKOUT
========================================= */

function buyNow(variantId){

  const realId =
  variantId.split('/').pop();

  window.location.href =
  `https://${domain}/cart/${realId}:1`;
}

</script>

</body>
</html>
