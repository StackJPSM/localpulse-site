<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shopify Storefront</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#050816;
  color:white;
  padding:40px;
}

h1{
  color:#63f5d2;
  margin-bottom:30px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.product-card{
  background:#0d1324;
  border:1px solid rgba(99,245,210,0.15);
  border-radius:18px;
  overflow:hidden;
}

.product-card img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.product-info{
  padding:18px;
}

.price{
  color:#63f5d2;
  font-size:1.3rem;
  font-weight:bold;
  margin:12px 0;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#63f5d2;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

pre{
  margin-top:40px;
  background:#111827;
  padding:15px;
  border-radius:10px;
  overflow:auto;
  color:#9ca3af;
  font-size:12px;
}
</style>
</head>

<body>

<h1>My Shopify Store</h1>

<div class="product-grid" id="productGrid"></div>

<pre id="debug">Loading Shopify data...</pre>

<script>

/* ==============================
SHOPIFY CONFIG
============================== */

const domain = "k3xcdb-cx.myshopify.com";

/* 🔴 PASTE YOUR STOREFRONT TOKEN HERE */
const storefrontAccessToken = "atkn_0004e0492a6ace3388b8778b0fa9780c25e9f62a896e050a0fd32a12a6aed9fc";

/* ==============================
DEBUG CHECK
============================== */

console.log("Shopify endpoint:");
console.log(`https://${domain}/api/2024-01/graphql.json`);

/* ==============================
FETCH PRODUCTS
============================== */

fetch(`https://${domain}/api/2024-01/graphql.json`, {
  method: "POST",
  headers: {
    "Content-Type": "application/json",
    "atkn_0004e0492a6ace3388b8778b0fa9780c25e9f62a896e050a0fd32a12a6aed9fc": storefrontAccessToken
  },
  body: JSON.stringify({
    query: `
    {
      products(first: 10) {
        edges {
          node {
            id
            title
            description
            images(first: 1) {
              edges {
                node {
                  url
                }
              }
            }
            variants(first: 1) {
              edges {
                node {
                  id
                  priceV2 {
                    amount
                    currencyCode
                  }
                }
              }
            }
          }
        }
      }
    }
    `
  })
})
.then(res => res.json())
.then(data => {

  console.log("Response:", data);

  document.getElementById("debug").textContent =
    JSON.stringify(data, null, 2);

  const products = data?.data?.products?.edges || [];
  const grid = document.getElementById("productGrid");

  if (!products.length) {
    grid.innerHTML = "<h2>No products found</h2>";
    return;
  }

  products.forEach(({ node }) => {

    const image =
      node.images.edges[0]?.node.url ||
      "https://via.placeholder.com/500";

    const variant =
      node.variants.edges[0]?.node;

    const price =
      variant?.priceV2?.amount || "0.00";

    const variantId =
      variant?.id;

    const card = document.createElement("div");
    card.className = "product-card";

    card.innerHTML = `
      <img src="${image}" />
      <div class="product-info">
        <h2>${node.title}</h2>
        <p>${node.description || ""}</p>
        <div class="price">$${price}</div>
        <button onclick="buyNow('${variantId}')">
          BUY NOW
        </button>
      </div>
    `;

    grid.appendChild(card);
  });

})
.catch(err => {
  console.error(err);
  document.getElementById("debug").textContent = err.toString();
});

/* ==============================
CHECKOUT
============================== */

function buyNow(variantId){
  if (!variantId) return;

  const realId = variantId.split("/").pop();
  window.location.href =
    `https://${domain}/cart/${realId}:1`;
}

</script>

</body>
</html>
